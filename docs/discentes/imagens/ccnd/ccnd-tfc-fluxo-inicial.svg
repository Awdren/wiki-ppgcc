<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fluxo da CCND TFC — cadastro e aprovação inicial</title>
  <desc id="d">O estudante cadastra a CCND e envia. O orientador analisa: se não estiver correta, a CCND é cancelada com motivo; se estiver, segue para o coordenador, que dá ciência e analisa. Se o coordenador recusar, a CCND é cancelada; se aprovar, ela fica em andamento. Durante o andamento, estudante ou orientador podem cancelar.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1100" height="380" rx="12" fill="#ffffff"/>
  <text x="10" y="30" font-size="18" font-weight="700" fill="#263238">1. Cadastro e aprovação inicial</text>

  <g transform="translate(0,45)">
    <!-- raias -->
    <rect x="0" y="0" width="1100" height="300" fill="#f7f9fa" stroke="#90a4ae"/>
    <line x1="0" y1="100" x2="1100" y2="100" stroke="#cfd8dc"/>
    <line x1="0" y1="200" x2="1100" y2="200" stroke="#cfd8dc"/>
    <rect x="0" y="0" width="120" height="100" fill="#1a73a8"/>
    <rect x="0" y="100" width="120" height="100" fill="#2e7d4f"/>
    <rect x="0" y="200" width="120" height="100" fill="#b26a00"/>
    <g fill="#fff" font-size="13" font-weight="700" text-anchor="middle">
      <text x="60" y="55">ESTUDANTE</text>
      <text x="60" y="155">ORIENTADOR</text>
      <text x="60" y="255">COORDENADOR</text>
    </g>

    <!-- nós -->
    <g font-size="13" font-weight="600" fill="#263238" text-anchor="middle">
      <circle cx="158" cy="50" r="12" fill="#fff" stroke="#37474f" stroke-width="2.5"/>
      <rect x="190" y="28" width="140" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="260" y="46">Cadastrar CCND</text><text x="260" y="63">e enviar</text>

      <rect x="370" y="128" width="140" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="440" y="146">Analisar</text><text x="440" y="163">solicitação</text>
      <polygon points="550,130 572,150 550,170 528,150" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
      <text x="550" y="155" font-size="12">OK?</text>

      <rect x="620" y="128" width="150" height="44" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
      <text x="695" y="146" fill="#b71c1c">CCND cancelada</text><text x="695" y="163" fill="#b71c1c" font-weight="400">(informar motivo)</text>
      <circle cx="812" cy="150" r="12" fill="#fff" stroke="#c62828" stroke-width="2.5"/>

      <rect x="600" y="228" width="140" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="670" y="246">Dar ciência</text><text x="670" y="263">e analisar</text>
      <polygon points="790,230 812,250 790,270 768,250" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
      <text x="790" y="255" font-size="12">OK?</text>

      <rect x="870" y="28" width="130" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d4f" stroke-width="2"/>
      <text x="935" y="46">CCND em</text><text x="935" y="63">andamento</text>
      <circle cx="1045" cy="50" r="12" fill="#fff" stroke="#37474f" stroke-width="4"/>
    </g>

    <!-- fluxo principal -->
    <g fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#a)">
      <line x1="170" y1="50" x2="189" y2="50"/>
      <path d="M330,50 H350 V150 H369"/>
      <line x1="510" y1="150" x2="527" y2="150"/>
      <path d="M550,170 V250 H599"/>
      <line x1="740" y1="250" x2="767" y2="250"/>
      <path d="M812,250 H840 V50 H869"/>
      <line x1="1000" y1="50" x2="1032" y2="50"/>
    </g>
    <!-- recusas e cancelamentos -->
    <g fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)">
      <line x1="572" y1="150" x2="619" y2="150"/>
      <path d="M790,230 V200 H730 V173"/>
      <line x1="770" y1="150" x2="799" y2="150"/>
      <path d="M935,72 V112 H695 V127"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="582" y="143" fill="#c62828">NÃO</text>
      <text x="556" y="190" fill="#2e7d4f">SIM</text>
      <text x="796" y="216" fill="#c62828">NÃO</text>
      <text x="818" y="242" fill="#2e7d4f">SIM</text>
    </g>
    <text x="943" y="88" font-size="11.5" fill="#c62828">cancelável pelo</text>
    <text x="943" y="102" font-size="11.5" fill="#c62828">estudante ou orientador</text>
  </g>

  <text x="10" y="368" font-size="12" fill="#546e7a">Linhas contínuas: fluxo principal · Linhas tracejadas vermelhas: recusa ou cancelamento (é preciso iniciar um novo cadastro desde o começo).</text>
</svg>
