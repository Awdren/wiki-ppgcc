<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fluxo da CCND TFC — banca, finalização, revisões e arquivamento</title>
  <desc id="d">O orientador cadastra a banca. O estudante envia a finalização. O orientador avalia: se pedir alterações, o estudante corrige e reenvia ao orientador; se aprovar, segue para o coordenador. O coordenador avalia: se pedir alterações, o estudante corrige e reenvia ao coordenador; se aprovar, a CCND é arquivada.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1100" height="380" rx="12" fill="#ffffff"/>
  <text x="10" y="30" font-size="18" font-weight="700" fill="#263238">2. Banca, finalização, revisões e arquivamento</text>

  <g transform="translate(0,45)">
    <!-- raias -->
    <rect x="0" y="0" width="1100" height="300" fill="#f7f9fa" stroke="#90a4ae"/>
    <line x1="0" y1="100" x2="1100" y2="100" stroke="#cfd8dc"/>
    <line x1="0" y1="200" x2="1100" y2="200" stroke="#cfd8dc"/>
    <rect x="0" y="0" width="120" height="100" fill="#1a73a8"/>
    <rect x="0" y="100" width="120" height="100" fill="#2e7d4f"/>
    <rect x="0" y="200" width="120" height="100" fill="#b26a00"/>
    <g fill="#fff" font-size="13" font-weight="700" text-anchor="middle">
      <text x="60" y="55">ESTUDANTE</text>
      <text x="60" y="155">ORIENTADOR</text>
      <text x="60" y="255">COORDENADOR</text>
    </g>

    <!-- nós -->
    <g font-size="13" font-weight="600" fill="#263238" text-anchor="middle">
      <circle cx="158" cy="150" r="12" fill="#fff" stroke="#37474f" stroke-width="2.5"/>
      <rect x="190" y="128" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="250" y="146">Cadastrar</text><text x="250" y="163">banca</text>

      <rect x="340" y="28" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="400" y="46">Enviar</text><text x="400" y="63">finalização</text>

      <rect x="490" y="128" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="550" y="146">Avaliar</text><text x="550" y="163">finalização</text>
      <polygon points="650,130 672,150 650,170 628,150" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
      <text x="650" y="155" font-size="12">OK?</text>

      <rect x="600" y="28" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="660" y="46">Corrigir e</text><text x="660" y="63">reenviar</text>

      <rect x="760" y="228" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="820" y="246">Avaliar</text><text x="820" y="263">finalização</text>
      <polygon points="920,230 942,250 920,270 898,250" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
      <text x="920" y="255" font-size="12">OK?</text>

      <rect x="860" y="28" width="120" height="44" rx="8" fill="#fff" stroke="#455a64" stroke-width="1.5"/>
      <text x="920" y="46">Corrigir e</text><text x="920" y="63">reenviar</text>

      <rect x="970" y="228" width="84" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d4f" stroke-width="2"/>
      <text x="1012" y="255">Arquivar</text>
      <circle cx="1078" cy="250" r="12" fill="#fff" stroke="#37474f" stroke-width="4"/>
    </g>

    <!-- fluxo principal -->
    <g fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#a)">
      <line x1="170" y1="150" x2="189" y2="150"/>
      <path d="M310,150 H325 V50 H339"/>
      <path d="M460,50 H475 V150 H489"/>
      <line x1="610" y1="150" x2="627" y2="150"/>
      <path d="M600,50 H580 V127"/>
      <path d="M672,150 H740 V250 H759"/>
      <line x1="880" y1="250" x2="897" y2="250"/>
      <path d="M860,50 H835 V227"/>
      <line x1="942" y1="250" x2="969" y2="250"/>
      <line x1="1054" y1="250" x2="1065" y2="250"/>
    </g>
    <!-- pedidos de alteração -->
    <g fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)">
      <line x1="650" y1="130" x2="650" y2="73"/>
      <line x1="920" y1="230" x2="920" y2="73"/>
    </g>
    <g font-size="11.5" font-weight="700">
      <text x="656" y="110" fill="#c62828">ALTERAR</text>
      <text x="680" y="143" fill="#2e7d4f">SIM</text>
      <text x="926" y="190" fill="#c62828">ALTERAR</text>
      <text x="943" y="242" fill="#2e7d4f">SIM</text>
    </g>
  </g>

  <text x="10" y="368" font-size="12" fill="#546e7a">O envio da finalização só é liberado depois que o orientador cadastra a banca. Linhas tracejadas vermelhas: solicitação de alterações.</text>
</svg>
